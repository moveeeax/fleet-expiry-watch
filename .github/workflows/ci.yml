name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: the README example must actually run
        run: |
          go run ./cmd/fleetwatch report \
            -vehicles examples/vehicles.csv \
            -drivers examples/drivers.csv \
            -operator "Pennine Haulage Ltd" \
            -today 2026-07-01 | tee /tmp/report.txt
          grep -q "3 lapsed, 16 due within 60 days" /tmp/report.txt
